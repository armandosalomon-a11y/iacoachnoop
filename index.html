<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mi Coach Privado</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #000; color: #fff; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 15px 20px; background-color: #1c1c1e; border-bottom: 1px solid #2c2c2e; display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 17px; }
    #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
    .msg { padding: 12px 16px; border-radius: 18px; max-width: 82%; line-height: 1.4; font-size: 15px; word-wrap: break-word; }
    .user { background-color: #0a84ff; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .bot { background-color: #1c1c1e; color: #e5e5ea; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #2c2c2e; }
    .input-container { padding: 12px 15px 25px 15px; background-color: #1c1c1e; display: flex; gap: 10px; border-top: 1px solid #2c2c2e; }
    input { flex: 1; background-color: #2c2c2e; border: none; border-radius: 20px; padding: 12px 16px; color: #fff; font-size: 16px; outline: none; }
    button { background-color: #0a84ff; color: white; border: none; border-radius: 20px; padding: 0 18px; font-weight: 600; font-size: 15px; cursor: pointer; }
    .icon-btn { background: none; border: none; color: #8e8e93; font-size: 18px; cursor: pointer; }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <header>
    <span>🔒 Coach Privado (Sincronizado)</span>
    <button class="icon-btn" onclick="resetData()">⚙️</button>
  </header>

  <div id="chat">
    <div class="msg bot">Cargando historial desde la nube...</div>
  </div>

  <div class="input-container">
    <input type="text" id="userInput" placeholder="Escribe tu mensaje..." onkeypress="handleKeyPress(event)" />
    <button id="sendBtn" onclick="enviarMensaje()">Enviar</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDPiP1zJ0KNe605d2ZuP6Uu4u-KU5ejnpg",
      authDomain: "mi-coach-noopdb.firebaseapp.com",
      projectId: "mi-coach-noopdb",
      storageBucket: "mi-coach-noopdb.firebasestorage.app",
      messagingSenderId: "320864669429",
      appId: "1:320864669429:web:3e80191ce7cadf76db7fbc",
      measurementId: "G-LFG6KPNSZQ"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const SYSTEM_PROMPT = `Eres el coach de nutrición y entrenamiento personal de Armando. Sé directo, breve, práctico, profesional y respetuoso. Enfócate en sus metas de masa muscular, nutrición y rendimiento. Consulta siempre el historial previo para recordar qué ha comido o entrenado.`;
    let chatHistory = [];

    function getGeminiKey() {
      let key = localStorage.getItem('MY_PRIVATE_GEMINI_KEY');
      if (!key) {
        key = prompt("🔒 Acceso Privado: Pega tu API Key de Gemini:");
        if (key && key.trim() !== "") localStorage.setItem('MY_PRIVATE_GEMINI_KEY', key.trim());
      }
      return key;
    }

    // Escuchar la base de datos en tiempo real
    db.collection("chats").doc("armando_session").onSnapshot((doc) => {
      const chatBox = document.getElementById('chat');
      chatBox.innerHTML = '';
      if (doc.exists && doc.data().history && doc.data().history.length > 0) {
        chatHistory = doc.data().history;
        chatHistory.forEach(msg => {
          const sender = msg.role === 'user' ? 'user' : 'bot';
          appendMessage(msg.parts[0].text, sender);
        });
      } else {
        chatBox.innerHTML = '<div class="msg bot">¡Hola Armando! Sincronización activa. ¿Qué comiste hoy o qué consulta tienes?</div>';
      }
    });

    async function enviarMensaje() {
      const input = document.getElementById('userInput');
      const sendBtn = document.getElementById('sendBtn');
      const text = input.value.trim();
      const apiKey = getGeminiKey();

      if (!text || !apiKey) return;

      input.value = '';
      sendBtn.disabled = true;

      chatHistory.push({ role: 'user', parts: [{ text: text }] });

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-lite-latest:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
            contents: chatHistory
          })
        });

        const data = await response.json();
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          const reply = data.candidates[0].content.parts[0].text;
          chatHistory.push({ role: 'model', parts: [{ text: reply }] });

          // Guardar en Firebase (sincroniza en tiempo real al cel y lap)
          await db.collection("chats").doc("armando_session").set({ history: chatHistory });
        }
      } catch (error) {
        alert("Error de conexión");
      } finally {
        sendBtn.disabled = false;
      }
    }

    async function resetData() {
      const opcion = confirm("¿Qué deseas hacer?\n\n[Aceptar] = Borrar historial en la nube (Borrón y cuenta nueva)\n[Cancelar] = Cambiar API Key de Gemini");
      if (opcion) {
        chatHistory = [];
        await db.collection("chats").doc("armando_session").set({ history: [] });
        alert("Historial borrado en todos tus dispositivos.");
      } else {
        const nuevaKey = prompt("Cambiar API Key de Gemini:", localStorage.getItem('MY_PRIVATE_GEMINI_KEY') || '');
        if (nuevaKey) localStorage.setItem('MY_PRIVATE_GEMINI_KEY', nuevaKey.trim());
      }
    }

    function appendMessage(text, sender) {
      const chat = document.getElementById('chat');
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      div.innerText = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function handleKeyPress(e) { if (e.key === 'Enter') enviarMensaje(); }
  </script>
</body>
</html>
