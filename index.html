<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mi Coach IA</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #000;
      color: #fff;
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 15px 20px;
      background-color: #1c1c1e;
      border-bottom: 1px solid #2c2c2e;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 17px;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      padding: 12px 16px;
      border-radius: 18px;
      max-width: 82%;
      line-height: 1.4;
      font-size: 15px;
      word-wrap: break-word;
    }
    .user {
      background-color: #0a84ff;
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .bot {
      background-color: #1c1c1e;
      color: #e5e5ea;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      border: 1px solid #2c2c2e;
    }
    .input-container {
      padding: 12px 15px 25px 15px;
      background-color: #1c1c1e;
      display: flex;
      gap: 10px;
      border-top: 1px solid #2c2c2e;
    }
    input {
      flex: 1;
      background-color: #2c2c2e;
      border: none;
      border-radius: 20px;
      padding: 12px 16px;
      color: #fff;
      font-size: 16px;
      outline: none;
    }
    button {
      background-color: #0a84ff;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 0 18px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }
    .icon-btn {
      background: none;
      border: none;
      color: #8e8e93;
      font-size: 18px;
      padding: 0;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <span>💪 Coach Nutrición</span>
    <button class="icon-btn" onclick="configurarKey()">⚙️</button>
  </header>

  <div id="chat">
    <div class="msg bot">¡Hola! Escribe qué comiste hoy o tus dudas sobre entrenamiento.</div>
  </div>

  <div class="input-container">
    <input type="text" id="userInput" placeholder="Ej: 3 huevos, 2 tortillas y café..." onkeypress="handleKeyPress(event)" />
    <button id="sendBtn" onclick="enviarMensaje()">Enviar</button>
  </div>

  <script>
    const SYSTEM_PROMPT = `Eres un coach experto en nutrición y entrenamiento. Tu objetivo es ayudar al usuario a mejorar su composición corporal y rendimiento físico. Sé breve, práctico y directo al punto.`;

    function getApiKey() {
      let key = localStorage.getItem('GEMINI_API_KEY');
      if (!key) {
        key = prompt("Ingresa tu API Key de Google Gemini (se guardará sólo en tu navegador):");
        if (key) {
          localStorage.setItem('GEMINI_API_KEY', key.trim());
        }
      }
      return key;
    }

    function configurarKey() {
      const nuevaKey = prompt("Modifica tu API Key de Gemini:", localStorage.getItem('GEMINI_API_KEY') || '');
      if (nuevaKey !== null) {
        localStorage.setItem('GEMINI_API_KEY', nuevaKey.trim());
        alert("API Key actualizada.");
      }
    }

    async function enviarMensaje() {
      const input = document.getElementById('userInput');
      const sendBtn = document.getElementById('sendBtn');
      const text = input.value.trim();
      const apiKey = getApiKey();

      if (!text) return;
      if (!apiKey) {
        alert("Necesitas ingresar una API Key para continuar.");
        return;
      }

      appendMessage(text, 'user');
      input.value = '';
      sendBtn.disabled = true;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [
              { role: 'user', parts: [{ text: `${SYSTEM_PROMPT}\n\nConsulta: ${text}` }] }
            ]
          })
        });

        const data = await response.json();
        
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          const reply = data.candidates[0].content.parts[0].text;
          appendMessage(reply, 'bot');
        } else {
          appendMessage("Error en la respuesta del servidor o clave inválida.", 'bot');
        }
      } catch (error) {
        appendMessage("Error de conexión con Gemini.", 'bot');
      } finally {
        sendBtn.disabled = false;
      }
    }

    function appendMessage(text, sender) {
      const chat = document.getElementById('chat');
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      div.innerText = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') enviarMensaje();
    }
  </script>
</body>
</html>
