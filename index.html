<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mi Coach Privado</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #000;
      color: #fff;
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 15px 20px;
      background-color: #1c1c1e;
      border-bottom: 1px solid #2c2c2e;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 17px;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      padding: 12px 16px;
      border-radius: 18px;
      max-width: 82%;
      line-height: 1.4;
      font-size: 15px;
      word-wrap: break-word;
    }
    .user {
      background-color: #0a84ff;
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .bot {
      background-color: #1c1c1e;
      color: #e5e5ea;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      border: 1px solid #2c2c2e;
    }
    .input-container {
      padding: 12px 15px 25px 15px;
      background-color: #1c1c1e;
      display: flex;
      gap: 10px;
      border-top: 1px solid #2c2c2e;
    }
    input {
      flex: 1;
      background-color: #2c2c2e;
      border: none;
      border-radius: 20px;
      padding: 12px 16px;
      color: #fff;
      font-size: 16px;
      outline: none;
    }
    button {
      background-color: #0a84ff;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 0 18px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }
    .icon-btn {
      background: none;
      border: none;
      color: #8e8e93;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <span>🔒 Coach Privado</span>
    <button class="icon-btn" onclick="resetKey()">⚙️</button>
  </header>

  <div id="chat">
    <div class="msg bot">¡Hola Armando! Coach listo. ¿Qué comiste hoy o qué consulta tienes?</div>
  </div>

  <div class="input-container">
    <input type="text" id="userInput" placeholder="Escribe tu mensaje..." onkeypress="handleKeyPress(event)" />
    <button id="sendBtn" onclick="enviarMensaje()">Enviar</button>
  </div>

 <script>
  const SYSTEM_PROMPT = `Eres el coach de nutrición y entrenamiento personal de Armando. Sé directo, breve, práctico y enfócate en sus metas de masa muscular, nutrición y rendimiento. Revisa siempre el historial anterior para recordar qué ha comido o qué entrenamientos ha realizado.`;

  // Array donde se guardará todo el historial de la conversación
  let chatHistory = [];

  function getApiKey() {
    let key = localStorage.getItem('MY_PRIVATE_GEMINI_KEY');
    if (!key) {
      key = prompt("🔒 Acceso Privado: Pega tu API Key de Gemini (Solo se guardará en este iPhone/Navegador):");
      if (key && key.trim() !== "") {
        localStorage.setItem('MY_PRIVATE_GEMINI_KEY', key.trim());
      }
    }
    return key;
  }

  function resetKey() {
    const nuevaKey = prompt("Cambiar/Actualizar tu API Key de Gemini:", localStorage.getItem('MY_PRIVATE_GEMINI_KEY') || '');
    if (nuevaKey !== null && nuevaKey.trim() !== "") {
      localStorage.setItem('MY_PRIVATE_GEMINI_KEY', nuevaKey.trim());
      alert("API Key guardada correctamente.");
    }
  }

  async function enviarMensaje() {
    const input = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const text = input.value.trim();
    const apiKey = getApiKey();

    if (!text) return;
    if (!apiKey) {
      alert("Necesitas ingresar tu API Key para poder usar la app.");
      return;
    }

    // 1. Mostrar mensaje en pantalla
    appendMessage(text, 'user');
    input.value = '';
    sendBtn.disabled = true;

    // 2. Agregar mensaje del usuario al historial
    chatHistory.push({
      role: 'user',
      parts: [{ text: text }]
    });

    try {
      // 3. Crear la estructura con System Instruction e Historial completo
      const requestBody = {
        systemInstruction: {
          parts: [{ text: SYSTEM_PROMPT }]
        },
        contents: chatHistory
      };

      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-lite-latest:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(requestBody)
      });

      const data = await response.json();
      
      if (data.candidates && data.candidates[0].content.parts[0].text) {
        const reply = data.candidates[0].content.parts[0].text;
        
        // 4. Agregar la respuesta del modelo al historial
        chatHistory.push({
          role: 'model',
          parts: [{ text: reply }]
        });

        appendMessage(reply, 'bot');
      } else {
        appendMessage("Error en la clave o respuesta del servidor. Revisa tu API Key en el ícono ⚙️.", 'bot');
      }
    } catch (error) {
      appendMessage("Error de conexión con Gemini.", 'bot');
    } finally {
      sendBtn.disabled = false;
    }
  }

  function appendMessage(text, sender) {
    const chat = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = `msg ${sender}`;
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function handleKeyPress(e) {
    if (e.key === 'Enter') enviarMensaje();
  }
</script>
</body>
</html>
